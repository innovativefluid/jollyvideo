# Release from the Actions tab: Run workflow → version → the tag is created, everything is tested
# and built, and a draft release is opened. Publish it under Releases when it looks right.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: version to release (must match manifest.json), e.g. 0.2.0
        required: true
      prerelease:
        description: mark as pre-release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          manifest=$(jq -r .version manifest.json)
          pkg=$(jq -r .version package.json)
          if [ "$manifest" != "${{ inputs.version }}" ] || [ "$pkg" != "${{ inputs.version }}" ]; then
            echo "manifest.json says $manifest and package.json $pkg, you asked for ${{ inputs.version }}"; exit 1
          fi
          tag="v${{ inputs.version }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # a tag left by a run that never got to publish (a cancelled build, say) is moved to this
          # commit and reused; a tag with a published release is a mistake and stops here
          force=""
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            published=$(gh release view "$tag" --json isDraft --jq '.isDraft | not' 2>/dev/null || echo false)
            if [ "$published" = "true" ]; then
              echo "$tag is already released"; exit 1
            fi
            echo "$tag exists but was never published: moving it to this commit"
            force="-f"
          fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag $force -a "$tag" -m "Jollyvideo ${{ inputs.version }}"
          git push $force origin "$tag"

  # check, all tests (media and package included) and the build, as on every push
  build:
    needs: tag
    uses: ./.github/workflows/ci.yml

  release:
    needs: [tag, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: jollyvideo, path: artifacts }
      - name: Release notes
        run: |
          version="${{ inputs.version }}"
          {
            echo "**Install:** \`jollyvideo-$version.tar.gz\` with Sharkord's plugin installer, or unpack \`jollyvideo-$version.zip\` into the server's plugins folder. The \`.sha256\` files hold the checksums."
            echo
            echo "## What's new"
            echo
            awk -v heading="## $version" '$0 == heading { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          name: Jollyvideo ${{ inputs.version }}
          files: artifacts/*
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: true
          draft: true
          prerelease: ${{ inputs.prerelease }}
