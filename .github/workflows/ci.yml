name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # the Release workflow runs all of this before it publishes anything
  workflow_call:
    outputs:
      sums:
        description: SHA-256 of each release file, as the build job made them
        value: ${{ jobs.build.outputs.sums }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }

      # the Bun Sharkord runs on
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile
      - run: bun run sharkord
      - run: bun run check
      - run: bun run test

      - uses: ./.github/actions/ffmpeg
      - run: pipx install yt-dlp
      - run: bun run test:media

      # GitHub's API limits anonymous calls, so this one may not block
      - run: bun run test:network
        continue-on-error: true

  # The release files, built on their own: nothing runs here but this repo and
  # the packages its lockfile pins, without their install scripts.
  build:
    runs-on: ubuntu-24.04
    outputs:
      sums: ${{ steps.sums.outputs.sums }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - run: bun run test:package
      # other jobs of the run could replace the uploaded files; the release checks them against these
      - id: sums
        run: echo "sums=$(cd dist && sha256sum *.tar.gz *.zip *.sha256 | tr '\n' ';')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jollyvideo
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  # the plugin in a real Sharkord, in a browser
  e2e:
    uses: ./.github/workflows/e2e.yml
