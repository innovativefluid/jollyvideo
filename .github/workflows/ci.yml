name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # the Release workflow runs all of this before it publishes anything
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }

      # the Bun Sharkord runs on
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile
      - run: bun run sharkord
      - run: bun run check
      - run: bun run test

      - uses: ./.github/actions/ffmpeg
      - run: pipx install yt-dlp
      - run: bun run test:media

      # GitHub's API limits anonymous calls, so this one may not block
      - run: bun run test:network
        continue-on-error: true

      - run: bun run build
      - run: bun run test:package

      - uses: actions/upload-artifact@v7
        with:
          name: jollyvideo
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  # the plugin in a real Sharkord, in a browser
  e2e:
    uses: ./.github/workflows/e2e.yml
